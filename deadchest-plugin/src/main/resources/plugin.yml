name: DeadChest
main: me.crylonz.deadchest.DeadChest
softdepend: [ Multiverse-Core, WorldGuard ]
author: Crylonz
version: ${pluginVersion}
description: Keep your inventory in a chest when you die
api-version: "1.13"
folia-supported: true
permissions:
  deadchest.generate:
    description: Allows a player to keep inventory in a chest when he dies
    default: op
  deadchest.get:
    description: Allows a player to get his inventory by picking his deadchest
    default: op
  deadchest.chestPass:
    description: Player can open all deadChest
    default: op
  deadchest.config:
    description: Allow a player to view and change DeadChest configuration with /dc config
    default: op
  deadchest.infinityChest:
    description: Player dead chest never disappear
    default: false
  deadchest.giveback:
    description: Allow a player to give back a deadchest to a player
    default: op
  deadchest.admin:
    description: Player dead chest never disappear
    default: op
  deadchest.remove.own:
    description: Allow a player to remove his deadchest
    default: op
  deadchest.remove.other:
    description: Allow a player to remove others players deadchest
    default: op
  deadchest.list.own:
    description: Allow a player to list his deadchests
    default: op
  deadchest.list.other:
    description: Allow a player to list other deadchests
    default: op
commands:
  dc:
    usage: /dc reload | repair [force] | remove [PlayerName] | removeinfinite | removeall | list [PlayerName|all] | giveback <player> [latest|oldest|all|id <n>] [inventory|ground] | giveback list <player> | giveback preview <player|list <player>> ... | config <get|set|reset|edit> | ignore
    description: List of commands
